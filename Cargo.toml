[package]
name = "arda-senderd"
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "arda-senderd"
path = "src/main.rs"

[dependencies]
protobuf = "3.7.1"
rustls = { version = "0.23" }
rustls-pemfile = "2"
wasmtime = { version = "=36.0.11", default-features = false, features = ["cranelift", "runtime", "std"] }

[build-dependencies]
protobuf-codegen = "3.7.1"
wat = "=1.236.0"
