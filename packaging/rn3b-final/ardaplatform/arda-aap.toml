# ARDA current bring-up baseline.
#
# This is intentionally conservative: video + input only. Audio and sensors are
# disabled until the live USB video path is stable. CLI flags passed after
# `aap-run` override these values for one-off A/B tests.

[transport]
mode = "usb-accessory"
usb_path = "/dev/usb_accessory"
# Kept for `--transport tcp` debugging only.
tcp_addr = "0.0.0.0:5277"

[session]
keys = "/data/local/tmp/arda-certs"
dump = "none"
response = "1.7"
max_frames = 0
timeout_ms = 60000
# After media starts, close a stale HU session when no inbound AAP frame is
# observed for this long. Set 0 to disable.
host_liveness_timeout_ms = 10000
max_bytes = 4194304
quiet_ping = true
log_level = "normal"
# Return the USB data gadget to adb after DHU disconnect or Ctrl-C. Cable power is untouched.
usb_reset_on_exit = true

[video]
native = true
auto_config = true
config_policy = "balanced"
bit_rate = 2500000
frames = 0
apply_wm_config = true
wm_size_mode = "content"
wm_density_mode = "real_density"
fast_start = true
display_profile = "waveshare-79"
# Old Android-12 first-frame dirty/kick hack. Keep off with platform screenrecord.
first_frame_kick = false

[input]
open = true
key_binding = true
inject = true
# Waveshare 7.9 / 270-degree setup: the platform bridge injects mapped logical
# display coordinates through the privileged system_ext InputManager bridge.
# app/uinput/shell remain available for isolated A/B tests.
inject_mode = "bridge"
app_move_min_ms = 16

[audio]
open = false
stream = "media"

[sensor]
# Persistent DHU/AAP location-only profile. The phone/DHU advertises the
# SensorSourceService; ARDA requests only SENSOR_LOCATION (type 1) and forwards
# fixes to the arda_gps GNSS bridge. VHAL forwarding remains disabled.
open = true
request_all = true
max_type = 1
period_ms = 200
jsonl = "none"
forward_os = true
forward_vhal = false
location_provider = "arda_gps"
location_min_ms = 200
vhal_min_ms = 500
# Embedded Wasmtime policy by default. External OEM/vehicle policy modules can
# be selected with a filesystem path while keeping AAP/TLS/SDR in Rust.
wasm = "builtin"
wasm_fuel = 50000
wasm_max_commands = 16
